[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pepforge"
version = "0.1.0"
description = "Universal Peptide Design, Engineering and Simulation Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "À définir" }
authors = [{ name = "Firas" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "pyyaml>=6.0",
    "gemmi>=0.7.5,<0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]
# Validation scientifique du module 3 : lecteur de référence indépendant (pas une dépendance d'exécution).
validation = [
    "biopython==1.88",
]

[project.scripts]
pepforge = "pepforge.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pepforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
# Typographie française (tirets demi-cadratin, signe ×) autorisée dans les textes.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Scripts de validation : motifs de code recopiés tels quels (défauts injectés) et
# libellés de résultats, plus lisibles sur une ligne.
"validation/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["pepforge"]

