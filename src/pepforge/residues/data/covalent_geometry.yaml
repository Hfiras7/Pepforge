# Critères de connectivité covalente entre résidus d'une structure importée (étape C).
#
# Aucun paramètre de champ de force. Ces valeurs servent à vérifier une liaison
# déclarée par le fichier (LINK, SSBOND, struct_conn, CONECT) et à signaler une
# liaison POSSIBLE entre deux atomes proches. Elles ne prouvent jamais qu'une
# liaison existe : une proximité sans déclaration est soumise à une décision
# explicite de l'utilisateur. Les valeurs réellement utilisées et leurs sources
# sont recopiées dans chaque rapport d'extraction.
version: 1

covalent_radii:
  # Rayons covalents de liaison simple, en Å, par élément (symbole chimique).
  # Seuls les non-métaux, les métalloïdes et les gaz rares figurent ici ; les
  # métaux sont classés à part (section metals) et ne reçoivent jamais de
  # liaison covalente possible.
  #
  # Pour le carbone, Cordero et al. donnent 0,76 (sp3), 0,73 (sp2) et 0,69 Å
  # (sp) : la valeur sp3 est retenue, la plus longue, puisque l'hybridation
  # n'est pas connue à la lecture d'une structure. Avec la tolérance ci-dessous,
  # l'écart de 0,07 Å ne change pas le seuil de plus de 0,07 Å, dans le sens
  # d'une détection plus large.
  values:
    H: 0.31
    HE: 0.28
    B: 0.84
    C: 0.76
    N: 0.71
    O: 0.66
    F: 0.57
    NE: 0.58
    SI: 1.11
    P: 1.07
    S: 1.05
    CL: 1.02
    AR: 1.06
    GE: 1.20
    AS: 1.19
    SE: 1.20
    BR: 1.20
    KR: 1.16
    SB: 1.39
    TE: 1.38
    I: 1.39
    XE: 1.40
  source: >-
    Cordero B., Gómez V., Platero-Prats A. E., Revés M., Echeverría J.,
    Cremades E., Barragán F., Alvarez S., « Covalent radii revisited », Dalton
    Transactions 2008, 2832-2838, DOI 10.1039/B801115J. Valeurs relues le
    28/11/2026 dans deux copies indépendantes de la table, toutes deux citant
    cet article et concordantes pour chaque élément de cette liste : ASE 3.30.0
    (ase/data/__init__.py, covalent_radii ; archive PyPI ase-3.30.0.tar.gz,
    SHA-256 59e1b1e5...30ff) et RDKit (Code/GraphMol/atomic_data.cpp, colonne
    rCov, branche master). L'article lui-même n'a pas été consulté (accès
    payant) : la concordance des deux copies est la vérification faite.

detection:
  # Deux atomes lourds de résidus différents sont en « liaison possible » quand
  # leur distance d vérifie  min_distance ≤ d ≤ r1 + r2 + tolerance.
  # Une liaison déclarée est « compatible avec les coordonnées » dans la même
  # fenêtre, et « incompatible » en dehors.
  tolerance: 0.45
  tolerance_source: >-
    Convention de perception des liaisons d'Open Babel : atomes plus proches
    que la somme de leurs rayons covalents, avec une tolérance de 0,45 Å pour
    les liaisons plus longues que la normale. O'Boyle N. M. et al., « Open
    Babel: An open chemical toolbox », Journal of Cheminformatics 3:33 (2011),
    DOI 10.1186/1758-2946-3-33, section « Bond Perception and Atom Typing ».
    Même tolérance dans OEChem (OpenEye, manuel C++ 1.3.1, section 11.1). C'est
    une convention logicielle, pas une constante physique ; elle est retenue
    parce qu'ici une détection trop large coûte une question à l'utilisateur,
    alors qu'une détection trop étroite coûte un composant perdu (proposition
    technique de l'étape C, décision 3). Firas a autorisé l'étape C le
    28/11/2026 sans fixer d'autre valeur : à confirmer à la revue de la PR.
  min_distance: 0.63
  min_distance_source: >-
    Open Babel (même référence) : « To handle disorder in crystallographic data
    (e.g., PDB or CIF files), atoms closer than 0.63 Å are not bonded ». Sous
    ce seuil, deux atomes se recouvrent : ce n'est pas une liaison, et le
    recouvrement lui-même est signalé.

metals:
  # Éléments traités comme métaux : un contact entre un métal et le peptide
  # n'est jamais une liaison covalente possible ; il est rapporté comme contact
  # métallique de nature non déterminée, et l'ion reste un ion (séparation
  # imposée par docs/ARCHITECTURE.md, section 11.4). Liste : blocs s (sauf H et
  # He), d et f, et métaux du bloc p (Al, Ga, In, Sn, Tl, Pb, Bi, Po).
  elements: [LI, BE, NA, MG, AL, K, CA, SC, TI, V, CR, MN, FE, CO, NI, CU, ZN,
             GA, RB, SR, Y, ZR, NB, MO, TC, RU, RH, PD, AG, CD, IN, SN, CS,
             BA, LA, CE, PR, ND, PM, SM, EU, GD, TB, DY, HO, ER, TM, YB, LU,
             HF, TA, W, RE, OS, IR, PT, AU, HG, TL, PB, BI, PO, FR, RA, AC,
             TH, PA, U, NP, PU, AM, CM]
  source: >-
    Classement de PepForge, pas une donnée publiée : groupes du tableau
    périodique de l'IUPAC (blocs s, d, f et métaux du bloc p). Ce classement ne
    porte aucune valeur numérique ; il décide seulement qu'un métal n'est
    jamais promu en liaison covalente.
